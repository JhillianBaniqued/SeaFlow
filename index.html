function rvw(i,v){const b=BG[i],nt=($('rvn').value||'').trim();if(v=='Flagged'&&!nt){$('rve').textContent='A note is required to flag a request.';return}b.st=v;b.rv=nt||'No issues found.';log('Break-glass review',b.ref);render();toast(v=='Flagged'?'Request flagged':'Marked as reviewed')}
function openP(r){if(BG[0]&&BG[0].live&&S.bg>Date.now()&&!BG[0].views.includes(r))BG[0].views.push(r);log('Viewed',r);go('patient',{sel:r})}
function bg(){const n=$('bn').value.trim();if(!n){$('be').textContent='A supporting note is required.';return}S.bg=Date.now()+POL.bg*60000;S.bgRef=S.sel;log('Break-glass',S.sel);L[0].n=$('br').value+' · '+n;BG.unshift({u:NM.staff,ref:S.sel,reason:$('br').value,note:n,t:now(),min:POL.bg,st:'New',views:[S.sel],live:1});N.unshift({to:'admin',x:`Break-glass request by ${NM.staff} on ${S.sel}.`,t:now()});go('patient');toast('Access granted for '+POL.bg+' minutes')}
function acc(i,v){let rn='';if(v=='no'){rn=($('rjn')||{value:''}).value.trim();if(!rn){const x=$('rje');if(x)x.textContent='A reason is required.';return}}S.cf=null;AC[i].rn=rn;AC[i].d=v;if(v=='ok')AGS.push({n:AC[i].n.replace(' · Demo',''),st:'Active',det:AC[i]});log('Account change',AC[i].n+(v=='ok'?' · approved':' · rejected'));render();toast(v=='ok'?'Account approved':'Account rejected')}
function tick(){const c=$('cd');if(!c)return;const ms=S.bg-Date.now();if(ms<=0){S.bg=null;render();toast('Access expired');return}c.innerHTML=`<b>Break-glass active</b> · expires in ${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`}
setInterval(tick,1000);render();
</script></body></html>
